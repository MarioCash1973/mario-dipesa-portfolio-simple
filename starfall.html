<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>STARFALL | Hidden Jump</title><link rel="stylesheet" href="styles.css"><style>
body{min-height:100dvh;background:radial-gradient(ellipse at 50% 30%,#172c48,#080d16 65%,#04060b);overflow-x:hidden;animation:starfall-arrival-fade 1.1s ease-out both}
@keyframes starfall-arrival-fade{from{opacity:0}to{opacity:1}}
.starfall-arrival{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px 24px;position:relative}
.starfall-arrival:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#d7e6ff 1px,transparent 1px);background-size:71px 83px;opacity:.23}
.starfall-arrival>*{position:relative}.starfall-ship{width:95px;height:95px;color:#c8d8eb;filter:drop-shadow(0 0 20px #87b7ff88);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}.starfall-arrival h1{font-size:clamp(48px,10vw,110px);letter-spacing:.15em;margin:22px 0 6px}.starfall-arrival .eyebrow{letter-spacing:.35em}
.starfall-arrival p{max-width:510px;color:#c4d0de;line-height:1.8}.starfall-arrival a{margin-top:30px;color:#d9b98b;border:1px solid #d9b98b;padding:12px 20px;border-radius:5px}
@media(prefers-reduced-motion:reduce){.starfall-ship{animation:none}}
</style></head><body><main class="starfall-arrival"><div class="eyebrow">SECRET DESTINATION UNLOCKED</div><svg class="starfall-ship" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1.5 21.4 11 25.5 13.3 29 26 20 22.8 16 29 12 22.8 3 26 6.5 13.3 10.6 11Z" fill="currentColor"/><path d="M16 8 18.3 16 16 20 13.7 16Z" fill="#11161c"/></svg><h1>STARFALL</h1><p>You've found the hidden jump. Your ship has arrived in uncharted space.</p><p><strong>Transmission incoming.</strong> The arcade mission is under construction. Check back for launch.</p><a href="index.html">← Return to portfolio</a></main></body></html>
