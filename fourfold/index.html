<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fourfold | Prototype</title><style>
*{box-sizing:border-box}body{margin:0;background:#080d1b;color:#eaf0ff;font:15px system-ui,sans-serif}#app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}h1{font-size:20px;margin:0;letter-spacing:.14em}#hud{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.stat{background:#141e33;border:1px solid #35445e;border-radius:9px;padding:6px 14px;text-align:center;min-width:80px}.stat b{display:block;font-size:19px}.stat small{color:#aab9d4}canvas{display:block;width:min(88vw,calc(100dvh - 235px),700px);aspect-ratio:1;border-radius:9px;background:#0b1020}#controls{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}button{background:#1b2945;border:1px solid #4c6080;color:#eaf0ff;border-radius:7px;padding:9px 12px;cursor:pointer;font:600 13px system-ui}button:hover{background:#293b60}#status{text-align:center;min-height:20px;color:#b8c7e0}#help{text-align:center;color:#aab9d4;font-size:12px}#app:fullscreen{background:#080d1b;overflow:auto}#app:fullscreen canvas{width:min(calc(100dvh - 205px),calc(100vw - 24px));max-width:none}@media(max-height:650px){#app{gap:5px;padding:5px}canvas{width:min(85vw,calc(100dvh - 160px))}#help{display:none}#app:fullscreen canvas{width:min(calc(100dvh - 150px),calc(100vw - 15px))}}
</style></head><body><main id="app"><h1>FOURFOLD</h1><div id="hud"><div class="stat"><b id="score">0</b><small>Score</small></div><div class="stat"><b id="rings">0</b><small>Rings</small></div><div class="stat"><b id="lives" style="color:#fb7185">♥ ♥ ♥</b><small>Lives</small></div><div class="stat"><b id="side">TOP</b><small>Entry</small></div><div class="stat"><b id="timer">—</b><small>Lock</small></div></div><canvas id="board" width="660" height="660"></canvas><div id="status">Press Start to play</div><div id="controls"><button id="start">Start / Restart</button><button id="pause">Pause</button><button id="rotate">↻ Rotate</button><button id="drop">⇣ Hard drop</button><button id="fullscreen">⛶ Fullscreen</button></div><div id="help">Arrow keys move / accelerate · Z/X rotate · Space hard drop · P pause · F fullscreen · Esc exit</div></main><script src="fourfold.js"></script></body></html>
